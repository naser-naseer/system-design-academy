name: Browser QA — Phase 7

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install application
        run: npm ci
      - name: Install isolated browser QA dependencies
        run: npm install --prefix qa --no-audit --no-fund
      - name: Install Chromium and system libraries
        run: ./qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Source and routing unit tests
        run: node --experimental-strip-types --test tests/*.test.mjs
      - name: Production build
        run: npm run build
      - name: Browser smoke and responsive checks
        run: npm --prefix qa test
      - name: Save browser reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa-failure
          path: |
            qa/playwright-report/
            qa/test-results/
          retention-days: 14
